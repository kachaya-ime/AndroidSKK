plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'io.github.kachaya.skk'
    compileSdk 37

    defaultConfig {
        applicationId "io.github.kachaya.skk"
        minSdk 28
        targetSdk 36
        versionCode 10300
        versionName "1.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Modern way to change APK name using Variant API
    androidComponents {
        onVariants(selector().all(), { variant ->
            variant.outputs.forEach { output ->
                def projectName = "AndroidSKK"
                def versionName = variant.outputs.first().versionName.getOrElse("1.0.0")
                output.outputFileName.set("${projectName}-${versionName}.apk")
            }
        })
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        buildConfig true
        resValues true
    }
}

dependencies {
    implementation files('libs/jdbm-1.0.jar')
    implementation libs.appcompat
    implementation libs.material
    implementation libs.preference
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.flexbox
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
